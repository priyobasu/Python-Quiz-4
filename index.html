<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Revise HTML!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      background-color: #ffdeeb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Pixel Floating Hearts Background */
    .heart-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .pixel-heart {
      position: absolute;
      width: 16px;
      height: 16px;
      background-color: #ff69b4;
      opacity: 0.6;
      box-shadow: 
        16px 0 #ff69b4, 
        -16px 0 #ff69b4, 
        0 -16px #ff69b4, 
        0 16px #ff69b4,
        16px 16px #ff1493,
        -16px 16px #ff1493,
        32px -16px #ffb6c1,
        -32px -16px #ffb6c1;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Main Container Card */
    .container {
      background: #ffffff;
      border: 6px solid #ff8da1;
      border-radius: 28px;
      width: 90%;
      max-width: 650px;
      padding: 32px 28px;
      box-shadow: 0 12px 30px rgba(255, 105, 180, 0.3);
      position: relative;
      z-index: 10;
      text-align: center;
    }

    h1 {
      color: #d81b60;
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    p.subtitle {
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 24px;
    }

    /* Buttons */
    .btn {
      background-color: #ff6584;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #c93b58;
      transition: all 0.1s ease;
    }

    .btn:hover {
      background-color: #ff476c;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c93b58;
    }

    /* Quiz Header Items */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 3px dashed #ffd1dc;
    }

    .q-count {
      font-weight: 700;
      color: #ff476c;
      font-size: 1.1rem;
    }

    .timer-badge {
      background: #ffe3ec;
      color: #d81b60;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid #ffb6c1;
    }

    .question-box {
      font-size: 1.3rem;
      color: #333;
      margin-bottom: 24px;
      font-weight: 600;
      text-align: left;
      line-height: 1.4;
    }

    .code-snippet {
      font-family: monospace;
      background: #fff0f5;
      padding: 3px 8px;
      border-radius: 6px;
      color: #d81b60;
    }

    /* Options Grid (6 Options) */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 500px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      background: #fff5f8;
      border: 3px solid #ffccd8;
      border-radius: 16px;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #444;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: #ffe3ec;
      border-color: #ff8da1;
    }

    .option-btn.selected {
      background: #ffd1dc;
      border-color: #ff476c;
      box-shadow: 0 0 0 2px #ff476c;
    }

    .option-btn.correct {
      background: #d4edda !important;
      border-color: #28a745 !important;
      color: #155724 !important;
    }

    .option-btn.wrong {
      background: #f8d7da !important;
      border-color: #dc3545 !important;
      color: #721c24 !important;
    }

    /* Feedback Box */
    .explanation-box {
      background: #f0f8ff;
      border: 2px dashed #87cefa;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: left;
      color: #1e3a8a;
      font-size: 0.98rem;
      display: none;
    }

    .explanation-box.show {
      display: block;
    }

    /* Actions */
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* Handwritten Report Card */
    .report-card {
      background: #fffdf5;
      border: 3px dashed #ffd15c;
      border-radius: 20px;
      padding: 24px;
      margin-top: 15px;
      position: relative;
    }

    .score-circle-container {
      margin: 20px auto;
      width: 140px;
      height: 140px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .score-text {
      font-family: 'Caveat', cursive;
      font-size: 3.5rem;
      color: #d81b60;
      line-height: 1;
      transform: rotate(-5deg);
    }

    .hand-circle {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .quote-box {
      font-size: 1.2rem;
      color: #555;
      margin-top: 15px;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background -->
  <div class="heart-bg" id="heartContainer"></div>

  <div class="container">
    
    <!-- HOME SCREEN -->
    <div id="homeScreen">
      <h1>Let's Revise HTML! 🎈</h1>
      <p class="subtitle">10 Fun questions to test your web building power!</p>
      <button class="btn" onclick="startQuiz()">Start Revision</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="hidden">
      <div class="quiz-header">
        <span class="q-count" id="qCount">Question 1 / 10</span>
        <span class="timer-badge" id="timer">⏱️ 30s</span>
      </div>

      <div class="question-box" id="questionText">
        <!-- Question inserted dynamically -->
      </div>

      <div class="options-grid" id="optionsGrid">
        <!-- 6 options populated dynamically -->
      </div>

      <div class="explanation-box" id="explanationBox">
        <!-- Explanation text -->
      </div>

      <div class="action-row">
        <button class="btn" id="submitBtn" onclick="submitAnswer()">Submit</button>
        <button class="btn hidden" id="nextBtn" onclick="nextQuestion()">Next ➔</button>
      </div>
    </div>

    <!-- REPORT CARD SCREEN -->
    <div id="resultsScreen" class="hidden">
      <h1>Quiz Completed! 🎉</h1>
      <p class="subtitle">Here is your HTML Revision Report Card:</p>

      <div class="report-card">
        <div class="score-circle-container">
          <!-- Handwritten SVG Circle -->
          <svg class="hand-circle" viewBox="0 0 100 100">
            <path d="M 50,10 A 40,38 0 1 0 90,55 A 42,40 0 0 0 46,8" 
                  fill="none" 
                  stroke="#ff1493" 
                  stroke-width="4" 
                  stroke-linecap="round" 
                  stroke-dasharray="300"
                  style="filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.15));"/>
          </svg>
          <div class="score-text" id="scoreDisplay">0/10</div>
        </div>

        <div class="quote-box" id="quoteDisplay">
          <!-- Quote based on level -->
        </div>
      </div>

      <button class="btn" style="margin-top: 24px;" onclick="resetQuiz()">Try Again 🔄</button>
    </div>

  </div>

  <script>
    // Create floating pixelated hearts
    const heartContainer = document.getElementById('heartContainer');
    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('div');
      heart.className = 'pixel-heart';
      heart.style.left = Math.random() * 95 + 'vw';
      heart.style.animationDuration = (6 + Math.random() * 6) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';
      heartContainer.appendChild(heart);
    }

    // 10 HTML Questions & Options
    const questionsData = [
      {
        question: "What can we create using HTML?",
        options: ["Website", "Operating System", "Mobile Hardware", "CPU Processor", "Database Server", "Video Game Console"],
        correct: 0,
        explanation: "HTML (HyperText Markup Language) is the standard language used to create and structure websites on the web!"
      },
      {
        question: "What do we use to create paragraphs in HTML?",
        options: ["<para>", "<p>", "<paragraph>", "<text>", "<pg>", "<ptag>"],
        correct: 1,
        explanation: "The p tag is specifically used to define paragraphs of text in HTML."
      },
      {
        question: "How many sizes of headings can be created in HTML?",
        options: ["3", "5", "6", "8", "10", "Unlimited"],
        correct: 2,
        explanation: "HTML offers exactly 6 heading levels, from <h1> (largest) to <h6> (smallest)."
      },
      {
        question: "Which tag do we use to add images in a webpage?",
        options: ["<image>", "<pic>", "<img>", "<picture>", "<photo>", "<imgsrc>"],
        correct: 2,
        explanation: "The img tag is used to embed images into an HTML page."
      },
      {
        question: "Which tag helps us see the name of the website on the browser tab?",
        options: ["<head>", "<tabname>", "<header>", "<title>", "<meta>", "<name>"],
        correct: 3,
        explanation: "The title tag defines the title shown in the browser's tab bar."
      },
      {
        question: "Which tag does not have a closing tag?",
        options: ["<div>", "<p>", "<br>", "<h1>", "<span>", "<body>"],
        correct: 2,
        explanation: "The br tag (line break) is a void element and does not require a closing tag."
      },
      {
        question: "Which attribute is used to change font sizes, colors, and make text/images look beautiful?",
        options: ["design", "style", "color", "format", "css", "theme"],
        correct: 1,
        explanation: "The 'style' attribute allows you to add inline CSS rules like color, font-size, and borders."
      },
      {
        question: "What do we use to get different shades of any color?",
        options: ["Binary code", "Tag code", "Hex code", "HTML number", "Style ID", "Font value"],
        correct: 2,
        explanation: "Hex codes (like #FF69B4) represent specific color shades using hexadecimal values."
      },
      {
        question: "How do we mention the property of a border for an image?",
        options: [
          "border: pixel style color",
          "border: color style pixel",
          "border-color: pixel color",
          "image-border: pixel style",
          "style-border: color pixel",
          "border-pixel: style color"
        ],
        correct: 0,
        explanation: "Border properties follow the format: width (pixels), style (e.g. solid), and color (e.g. border: 2px solid red)."
      },
      {
        question: "Under which tag do we add the website background color?",
        options: ["<background>", "<html>", "<color>", "<body>", "<head>", "<main>"],
        correct: 3,
        explanation: "The body tag holds all visible web page contents, so background colors are applied to it."
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOption = null;
    let timerInterval = null;
    let timeLeft = 30;

    // DOM Elements
    const homeScreen = document.getElementById('homeScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultsScreen = document.getElementById('resultsScreen');
    const qCount = document.getElementById('qCount');
    const timerElem = document.getElementById('timer');
    const questionText = document.getElementById('questionText');
    const optionsGrid = document.getElementById('optionsGrid');
    const explanationBox = document.getElementById('explanationBox');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const quoteDisplay = document.getElementById('quoteDisplay');

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      homeScreen.classList.add('hidden');
      resultsScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      loadQuestion();
    }

    function loadQuestion() {
      // Reset state
      selectedOption = null;
      explanationBox.classList.remove('show');
      submitBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');
      
      const q = questionsData[currentQuestionIndex];
      qCount.textContent = `Question ${currentQuestionIndex + 1} / ${questionsData.length}`;
      questionText.innerHTML = q.question;
      
      // Render 6 options
      optionsGrid.innerHTML = '';
      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = optText.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        btn.onclick = () => selectOption(idx);
        optionsGrid.appendChild(btn);
      });

      // Reset and Start Timer
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 30;
      timerElem.textContent = `⏱️ ${timeLeft}s`;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerElem.textContent = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitAnswer(true); // auto-submit on timeout
        }
      }, 1000);
    }

    function selectOption(index) {
      if (submitBtn.classList.contains('hidden')) return; // ignore if already submitted
      
      selectedOption = index;
      const buttons = optionsGrid.children;
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('selected');
      }
      buttons[index].classList.add('selected');
    }

    function submitAnswer(timedOut = false) {
      clearInterval(timerInterval);
      
      const q = questionsData[currentQuestionIndex];
      const buttons = optionsGrid.children;

      if (selectedOption === null && !timedOut) {
        alert("Please select an option first!");
        startTimer(); // resume timer
        return;
      }

      // Hide submit, show next
      submitBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');

      // Highlight correct/wrong
      if (selectedOption !== null) {
        if (selectedOption === q.correct) {
          buttons[selectedOption].classList.add('correct');
          score++;
        } else {
          buttons[selectedOption].classList.add('wrong');
          buttons[q.correct].classList.add('correct');
        }
      } else {
        // Timed out with no selection
        buttons[q.correct].classList.add('correct');
      }

      // Show explanation
      explanationBox.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
      explanationBox.classList.add('show');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionsData.length) {
        loadQuestion();
      } else {
        showReportCard();
      }
    }

    function showReportCard() {
      quizScreen.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      scoreDisplay.textContent = `${score}/${questionsData.length}`;

      // Motivational quotes based on performance tier
      let quote = "";
      if (score <= 5) {
        quote = "Keep practicing! Every web developer starts from scratch. You'll master this in no time! 💪✨";
      } else if (score <= 9) {
        quote = "Awesome job! You have a super strong foundation in HTML. Just a little more polish and you'll be a pro! 🚀🌟";
      } else {
        quote = "Perfect Score! You are an HTML Wizard! Absolutely incredible work! 🧙‍♂️🎉";
      }

      quoteDisplay.textContent = quote;
    }

    function resetQuiz() {
      startQuiz();
    }
  </script>
</body>
</html>
