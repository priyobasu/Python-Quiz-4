<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Revise Python Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      background-color: #d8f3dc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    /* Pixel Floating Balloons Background */
    .balloon-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .pixel-balloon {
      position: absolute;
      width: 20px;
      height: 24px;
      background-color: #1b4332;
      opacity: 0.55;
      box-shadow: 
        4px -4px 0 #1b4332, 8px -4px 0 #1b4332, 12px -4px 0 #1b4332,
        -4px 4px 0 #1b4332, 24px 4px 0 #1b4332,
        -4px 8px 0 #1b4332, 24px 8px 0 #1b4332,
        -4px 12px 0 #1b4332, 24px 12px 0 #1b4332,
        0px 16px 0 #1b4332, 20px 16px 0 #1b4332,
        4px 20px 0 #1b4332, 16px 20px 0 #1b4332,
        8px 24px 0 #081c15, 12px 24px 0 #081c15, 
        10px 28px 0 #2d6a4f, 8px 32px 0 #2d6a4f, 12px 36px 0 #2d6a4f, 10px 40px 0 #2d6a4f;
      animation: floatUpBalloon linear infinite;
    }

    @keyframes floatUpBalloon {
      0% {
        transform: translateY(108vh) scale(0.8);
        opacity: 0;
      }
      15% {
        opacity: 0.55;
      }
      100% {
        transform: translateY(-15vh) scale(1.1);
        opacity: 0;
      }
    }

    /* Main Container Card */
    .container {
      background: #ffffff;
      border: 6px solid #52b788;
      border-radius: 28px;
      width: 100%;
      max-width: 700px;
      padding: 32px 24px;
      box-shadow: 0 12px 30px rgba(45, 106, 79, 0.25);
      position: relative;
      z-index: 10;
      text-align: center;
    }

    h1 {
      color: #1b4332;
      font-size: 2.1rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #40916c;
      font-size: 1.1rem;
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      background-color: #2d6a4f;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #1b4332;
      transition: all 0.1s ease;
    }

    .btn:hover {
      background-color: #40916c;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1b4332;
    }

    /* Quiz Header Items */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 3px dashed #b7e4c7;
    }

    .q-count {
      font-weight: 700;
      color: #2d6a4f;
      font-size: 1.1rem;
    }

    .timer-badge {
      background: #d8f3dc;
      color: #1b4332;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid #74c69d;
    }

    .question-box {
      font-size: 1.2rem;
      color: #1b4332;
      margin-bottom: 16px;
      font-weight: 600;
      text-align: left;
      line-height: 1.4;
    }

    .instruction-note {
      font-size: 0.95rem;
      color: #2d6a4f;
      background: #e8f5e9;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: left;
      font-weight: 600;
    }

    /* Code Snippet Box with Proper Indentation */
    pre.code-block {
      background: #f0fdf4;
      border: 2px solid #74c69d;
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      color: #081c15;
      text-align: left;
      margin: 10px 0 20px 0;
      white-space: pre;
      overflow-x: auto;
      font-weight: 700;
    }

    /* Options Grid Layout */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-card {
      background: #f0fdf4;
      border: 3px solid #b7e4c7;
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-card:hover {
      background: #d8f3dc;
      border-color: #52b788;
    }

    .option-card.selected {
      background: #b7e4c7;
      border-color: #2d6a4f;
      box-shadow: 0 0 0 2px #2d6a4f;
    }

    .option-card.correct {
      background: #d4edda !important;
      border-color: #28a745 !important;
    }

    .option-card.wrong {
      background: #f8d7da !important;
      border-color: #dc3545 !important;
    }

    .option-text {
      font-size: 1rem;
      font-weight: 600;
      color: #1b4332;
    }

    .option-card.correct .option-text {
      color: #155724;
    }

    .option-card.wrong .option-text {
      color: #721c24;
    }

    /* Inline Explanation Under Buttons */
    .inline-explanation {
      display: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 4px;
      line-height: 1.35;
    }

    .option-card.correct .inline-explanation {
      display: block;
      background-color: #c3e6cb;
      color: #155724;
      border: 1px solid #81c784;
    }

    .option-card.wrong .inline-explanation {
      display: block;
      background-color: #f5c6cb;
      color: #721c24;
      border: 1px solid #e57373;
    }

    /* Actions */
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* Handwritten Report Card */
    .report-card {
      background: #f0fdf4;
      border: 3px dashed #74c69d;
      border-radius: 20px;
      padding: 24px;
      margin-top: 15px;
      position: relative;
    }

    .score-circle-container {
      margin: 20px auto;
      width: 140px;
      height: 140px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .score-text {
      font-family: 'Caveat', cursive;
      font-size: 3.5rem;
      color: #1b4332;
      line-height: 1;
      transform: rotate(-5deg);
    }

    .hand-circle {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .quote-box {
      font-size: 1.2rem;
      color: #2d6a4f;
      margin-top: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Pixelated Balloons Background -->
  <div class="balloon-bg" id="balloonContainer"></div>

  <div class="container">
    
    <!-- HOME SCREEN -->
    <div id="homeScreen">
      <h1>Revise Python Concepts 🎈</h1>
      <p class="subtitle">Let's revise Python, gesture recognition, and image processing concepts!</p>
      <button class="btn" onclick="startQuiz()">Start Revision</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="hidden">
      <div class="quiz-header">
        <span class="q-count" id="qCount">Question 1 / 10</span>
        <span class="timer-badge" id="timer">⏱️ 30s</span>
      </div>

      <div class="question-box" id="questionText"></div>

      <div id="codeContainer"></div>

      <div id="instructionNote" class="instruction-note hidden"></div>

      <div class="options-grid" id="optionsGrid"></div>

      <div class="action-row">
        <button class="btn" id="submitBtn" onclick="submitAnswer()">Submit</button>
        <button class="btn hidden" id="nextBtn" onclick="nextQuestion()">Next ➔</button>
      </div>
    </div>

    <!-- REPORT CARD SCREEN -->
    <div id="resultsScreen" class="hidden">
      <h1>Quiz Completed! 🎉</h1>
      <p class="subtitle">Here is your Python Revision Report Card:</p>

      <div class="report-card">
        <div class="score-circle-container">
          <svg class="hand-circle" viewBox="0 0 100 100">
            <path d="M 50,10 A 40,38 0 1 0 90,55 A 42,40 0 0 0 46,8" 
                  fill="none" 
                  stroke="#2d6a4f" 
                  stroke-width="4" 
                  stroke-linecap="round" 
                  stroke-dasharray="300"
                  style="filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.15));"/>
          </svg>
          <div class="score-text" id="scoreDisplay">0/10</div>
        </div>

        <div class="quote-box" id="quoteDisplay"></div>
      </div>

      <button class="btn" style="margin-top: 24px;" onclick="resetQuiz()">Try Again 🔄</button>
    </div>

  </div>

  <script>
    // Create floating pixelated balloons in dark green shades
    const balloonContainer = document.getElementById('balloonContainer');
    for (let i = 0; i < 16; i++) {
      const balloon = document.createElement('div');
      balloon.className = 'pixel-balloon';
      balloon.style.left = Math.random() * 92 + 'vw';
      balloon.style.animationDuration = (7 + Math.random() * 7) + 's';
      balloon.style.animationDelay = (Math.random() * 5) + 's';
      balloonContainer.appendChild(balloon);
    }

    // Questions Data - Correct options are placed in varied positions across questions
    const questionsData = [
      {
        question: "Which pretrained model is commonly used for face detection and smile detection?",
        type: "single",
        options: [
          { text: "YOLOv8", isCorrect: false, exp: "Why this is wrong: YOLO is designed for real-time general object detection bounding boxes, not classic Haar feature XML classifiers." },
          { text: "Haar Cascade", isCorrect: true, exp: "Correct! Haar Cascade classifiers are machine learning object detection models used to identify faces, eyes, and smiles in OpenCV." },
          { text: "ResNet-50", isCorrect: false, exp: "Why this is wrong: ResNet is a deep convolutional neural network architecture used for image classification." },
          { text: "MobileNet", isCorrect: false, exp: "Why this is wrong: MobileNet is a lightweight neural network architecture, not the classic OpenCV Haar cascade model." }
        ]
      },
      {
        question: "Which library is used for gesture recognition and hand landmark detection?",
        type: "single",
        options: [
          { text: "Matplotlib", isCorrect: false, exp: "Why this is wrong: Matplotlib is a plotting library used for creating charts and graphs." },
          { text: "Mediapipe", isCorrect: true, exp: "Correct! Mediapipe is Google's open-source framework specifically used for hand tracking, gesture recognition, and face mesh detection." },
          { text: "SciPy", isCorrect: false, exp: "Why this is wrong: SciPy is used for scientific computing and mathematical routines, not computer vision landmarks." },
          { text: "Pygame", isCorrect: false, exp: "Why this is wrong: Pygame is used to write 2D video games in Python." }
        ]
      },
      {
        question: "Which landmark index number is used to detect the tip of the index finger in gesture recognition?",
        type: "single",
        options: [
          { text: "Index 4", isCorrect: false, exp: "Why this is wrong: Index 4 represents the tip of the Thumb in Mediapipe." },
          { text: "Index 12", isCorrect: false, exp: "Why this is wrong: Index 12 represents the tip of the Middle finger in Mediapipe." },
          { text: "Index 8", isCorrect: true, exp: "Correct! Landmark index 8 corresponds to the Index Finger Tip in Mediapipe's 21 hand landmark model." },
          { text: "Index 16", isCorrect: false, exp: "Why this is wrong: Index 16 represents the tip of the Ring finger." }
        ]
      },
      {
        question: "What is the basic sequence of processing frames before any detection model is applied?",
        type: "single",
        options: [
          { text: "Grab frame ➔ Open Webcam ➔ Convert to grayscale", isCorrect: false, exp: "Why this is wrong: You cannot grab a frame before opening the webcam connection!" },
          { text: "Open Webcam ➔ Grab frame ➔ Convert to grayscale", isCorrect: true, exp: "Correct! First connect to webcam, then capture/read a video frame, and finally convert it to grayscale for processing." },
          { text: "Convert to grayscale ➔ Open Webcam ➔ Grab frame", isCorrect: false, exp: "Why this is wrong: Grayscale conversion needs an actual frame image that must be grabbed first." },
          { text: "Open Webcam ➔ Convert to grayscale ➔ Grab frame", isCorrect: false, exp: "Why this is wrong: You must read/grab the frame image from the webcam before applying color conversion." }
        ]
      },
      {
        question: "State true or false: Grayscale reduces the colour channel to 2.",
        type: "tf",
        options: [
          { text: "True", isCorrect: false, exp: "Why this is wrong: Grayscale images do NOT have 2 channels; they reduce 3 color channels down to 1 single channel." },
          { text: "False", isCorrect: true, exp: "Correct! A grayscale image has only 1 channel representing pixel intensity from 0 (black) to 255 (white)." }
        ]
      },
      {
        question: "Which NumPy function is used to create a colored canvas with a specific fill value?",
        type: "single",
        options: [
          { text: "np.zeros()", isCorrect: false, exp: "Why this is wrong: np.zeros() fills the canvas with zeros, creating a purely black image." },
          { text: "np.empty()", isCorrect: false, exp: "Why this is wrong: np.empty() creates an array without initializing entries to a specific color." },
          { text: "np.full()", isCorrect: true, exp: "Correct! np.full((height, width, 3), fill_value) creates a canvas filled with your chosen color values!" },
          { text: "np.ones()", isCorrect: false, exp: "Why this is wrong: np.ones() fills all entries with 1, which appears almost completely black." }
        ]
      },
      {
        question: "State true or false: OpenCV pixels use R, G, B format for colours.",
        type: "tf",
        options: [
          { text: "True", isCorrect: false, exp: "Why this is wrong: OpenCV does NOT use RGB by default; it reads color images in BGR format." },
          { text: "False", isCorrect: true, exp: "Correct! OpenCV stores color pixels in BGR (Blue, Green, Red) format sequence." }
        ]
      },
      {
        question: "What is the starting index value in a Python list?",
        type: "single",
        options: [
          { text: "1", isCorrect: false, exp: "Why this is wrong: Python uses zero-based indexing, so 1 is the index of the second item." },
          { text: "0", isCorrect: true, exp: "Correct! In Python, indexing starts at 0 for the first element in any list or array." },
          { text: "-1", isCorrect: false, exp: "Why this is wrong: -1 is used in Python to access the last element of a list from the end." },
          { text: "2", isCorrect: false, exp: "Why this is wrong: 2 refers to the third position in a list." }
        ]
      },
      {
        question: "What is the error in the following code?",
        code: `if a % 2 == "0":\n    print("odd")\nelse:\n    print("even")`,
        type: "single",
        options: [
          { text: "The modulo operator % is invalid in if conditions", isCorrect: false, exp: "Why this is wrong: % is the valid modulo operator used to find the remainder of division." },
          { text: "0 is an integer and cannot be within quotations '0'", isCorrect: true, exp: "Correct! 'a % 2' produces an integer (0 or 1), so comparing it to the string \"0\" will always be False." },
          { text: "Print statements inside if statements should not be indented", isCorrect: false, exp: "Why this is wrong: Python requires indentation inside if/else blocks." },
          { text: "The else block requires a condition statement", isCorrect: false, exp: "Why this is wrong: else blocks never take conditions in Python." }
        ]
      },
      {
        question: "What is the final value of variable 'a' in this code snippet?",
        code: `a = 2\na = a + 8\na = a ** 2 == 100`,
        type: "single",
        options: [
          { text: "10", isCorrect: false, exp: "Why this is wrong: 2 + 8 is 10, but the third line performs 'a ** 2 == 100', assigning a Boolean comparison result to 'a'." },
          { text: "100", isCorrect: false, exp: "Why this is wrong: 10 ** 2 equals 100, but '100 == 100' evaluates to a Boolean value (True or False), not integer 100." },
          { text: "True", isCorrect: true, exp: "Correct! First a = 2 + 8 = 10. Then 10 ** 2 is 100. Finally 100 == 100 evaluates to True!" },
          { text: "False", isCorrect: false, exp: "Why this is wrong: Since 10 squared is 100, 100 == 100 evaluates to True, not False." },
          { text: "64", isCorrect: false, exp: "Why this is wrong: 2 + 8 = 10, not 8." },
          { text: "2", isCorrect: false, exp: "Why this is wrong: 2 was only the initial starting value of variable 'a'." }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let selectedIndices = [];
    let timerInterval = null;
    let timeLeft = 30;

    // DOM Elements
    const homeScreen = document.getElementById('homeScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultsScreen = document.getElementById('resultsScreen');
    const qCount = document.getElementById('qCount');
    const timerElem = document.getElementById('timer');
    const questionText = document.getElementById('questionText');
    const codeContainer = document.getElementById('codeContainer');
    const instructionNote = document.getElementById('instructionNote');
    const optionsGrid = document.getElementById('optionsGrid');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const quoteDisplay = document.getElementById('quoteDisplay');

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      homeScreen.classList.add('hidden');
      resultsScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      loadQuestion();
    }

    function loadQuestion() {
      // Reset state
      selectedIndices = [];
      submitBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');
      
      const q = questionsData[currentQuestionIndex];
      qCount.textContent = `Question ${currentQuestionIndex + 1} / ${questionsData.length}`;
      questionText.innerHTML = q.question;

      // Render Code Block if present
      codeContainer.innerHTML = '';
      if (q.code) {
        const pre = document.createElement('pre');
        pre.className = 'code-block';
        pre.textContent = q.code;
        codeContainer.appendChild(pre);
      }

      // Instruction note if needed
      if (q.instruction) {
        instructionNote.textContent = q.instruction;
        instructionNote.classList.remove('hidden');
      } else {
        instructionNote.classList.add('hidden');
      }
      
      // Render options
      optionsGrid.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.onclick = () => handleOptionClick(idx);

        const textDiv = document.createElement('div');
        textDiv.className = 'option-text';
        textDiv.innerHTML = opt.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

        const expDiv = document.createElement('div');
        expDiv.className = 'inline-explanation';
        expDiv.innerHTML = opt.exp;

        card.appendChild(textDiv);
        card.appendChild(expDiv);
        optionsGrid.appendChild(card);
      });

      // Reset and Start Timer
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 30;
      timerElem.textContent = `⏱️ ${timeLeft}s`;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerElem.textContent = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitAnswer(true); // auto-submit on timeout
        }
      }, 1000);
    }

    function handleOptionClick(index) {
      if (submitBtn.classList.contains('hidden')) return; // ignore clicks after submission
      
      const q = questionsData[currentQuestionIndex];
      const cards = optionsGrid.children;

      selectedIndices = [index];
      for (let i = 0; i < cards.length; i++) {
        cards[i].classList.remove('selected');
      }
      cards[index].classList.add('selected');
    }

    function submitAnswer(timedOut = false) {
      clearInterval(timerInterval);
      
      const q = questionsData[currentQuestionIndex];
      const cards = optionsGrid.children;

      if (selectedIndices.length === 0 && !timedOut) {
        alert("Please select an option first!");
        startTimer(); // resume timer
        return;
      }

      // Hide submit, show next button
      submitBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');

      const selectedIdx = selectedIndices[0];

      // Highlight explanations under correct and wrong buttons
      q.options.forEach((opt, idx) => {
        if (opt.isCorrect) {
          cards[idx].classList.add('correct'); // Explanation under correct button
        }
      });

      if (selectedIdx !== undefined) {
        if (q.options[selectedIdx].isCorrect) {
          score++;
        } else {
          cards[selectedIdx].classList.add('wrong'); // Explanation under clicked wrong button
        }
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionsData.length) {
        loadQuestion();
      } else {
        showReportCard();
      }
    }

    function showReportCard() {
      quizScreen.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      scoreDisplay.textContent = `${score}/${questionsData.length}`;

      // Motivational quotes tailored for Python Concepts
      let quote = "";
      if (score <= 5) {
        quote = "Keep practicing! Python and Computer Vision take patience to master. Every line of code brings you closer to your goal! 🎈🐍";
      } else if (score <= 9) {
        quote = "Great work! You have a solid grasp of Python concepts and computer vision fundamentals! Keep building! 🚀🟢";
      } else {
        quote = "Perfect 10/10 score! You are a Python and Computer Vision Master! Outstanding work! 🏆✨";
      }

      quoteDisplay.textContent = quote;
    }

    function resetQuiz() {
      startQuiz();
    }
  </script>
</body>
</html>
